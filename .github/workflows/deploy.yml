name: Publicar Workers
on:
  workflow_run:
    workflows: [Validar cardápio]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente validado (produção exige aprovação do environment)
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir credenciais de publicação
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure o secret CLOUDFLARE_API_TOKEN e a variável CLOUDFLARE_ACCOUNT_ID no environment escolhido."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run assets
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser
      - run: npm run build
      - name: Conferir configuração do ambiente
        run: node scripts/check-deploy.mjs "$DEPLOY_ENV"
      - name: Migrar banco do ambiente
        run: npx wrangler d1 migrations apply "saver-$DEPLOY_ENV" --remote --env "$DEPLOY_ENV" --config wrangler.admin.jsonc
      - run: npx wrangler deploy --env "$DEPLOY_ENV" --config wrangler.public.jsonc
      - run: npx wrangler deploy --env "$DEPLOY_ENV" --config wrangler.admin.jsonc
